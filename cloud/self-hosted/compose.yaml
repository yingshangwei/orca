services:
  relay-init:
    image: orca-selfhost-relay:local
    build:
      context: ..
      dockerfile: apps/relay/Dockerfile
    user: '0:0'
    entrypoint: ['/bin/sh', '-ec']
    command:
      - >-
        mkdir -p /data/state;
        cp /run/secrets/relay_auth /data/auth.json;
        chown -R node:node /data;
        chmod 700 /data /data/state;
        chmod 600 /data/auth.json
    secrets:
      - relay_auth
    volumes:
      - relay_data:/data
    network_mode: none
    restart: 'no'

  relay:
    image: orca-selfhost-relay:local
    depends_on:
      relay-init:
        condition: service_completed_successfully
    env_file:
      - generated/public.env
      - generated/relay.env
    volumes:
      - relay_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2-alpine
    depends_on:
      relay:
        condition: service_healthy
    env_file:
      - generated/public.env
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

secrets:
  relay_auth:
    file: ./generated/auth.json

volumes:
  relay_data:
  caddy_data:
  caddy_config:
